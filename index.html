<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод ключей | Кластер</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #5865F2;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-transform: uppercase;
        }
        input:focus {
            border-color: #5865F2;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }
        .error { color: #ff4d4d; }
        .success { color: #4dff88; }
        .hint {
            margin-top: 20px;
            padding: 10px;
            background-color: #2b2b2b;
            border-left: 3px solid #5865F2;
            font-size: 12px;
            color: #aaa;
            text-align: left;
            line-height: 1.4;
        }
        a.bot-link {
            color: #5865F2;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h2>Проверка Кода</h2>
    
    <div class="input-group">
        <label for="textInput">Код из букв (4 символа):</label>
        <input type="text" id="textInput" maxlength="4" placeholder="AAAA">
    </div>

    <div class="input-group">
        <label for="numberInput">Код из цифр (7 символов):</label>
        <input type="text" id="numberInput" maxlength="7" placeholder="0000000">
    </div>

    <button onclick="checkCodes()">ОТПРАВИТЬ</button>

    <div id="message"></div>

    <div class="hint">
        <strong>Подсказка:</strong><br>
        6&7, интересные цифры, многими ненавистные в их сочетании, жаль их нельзя найти в Майнкрафт, или можно?
    </div>
</div>

<script>
    // Защита от F12, Ctrl+U и контекстного меню
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || 
           (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
           (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    // Автономная функция SHA-256 (работает без сторонних библиотек)
    function computeSHA256(str) {
        function rightRotate(value, amount) {
            return (value >>> amount) | (value << (32 - amount));
        }
        
        var mathPow = Math.pow;
        var maxWord = mathPow(2, 32);
        var lengthProperty = 'length';
        var i, j;
        var result = '';

        var words = [];
        var asciiBitLength = str[lengthProperty] * 8;
        
        var hash = [
            0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
            0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
        ];
        var k = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];

        str += '\x80';
        while (str[lengthProperty] % 64 - 56) str += '\x00';
        for (i = 0; i < str[lengthProperty]; i++) {
            j = str.charCodeAt(i);
            if (j >> 8) return;
            words[i >> 2] |= j << ((3 - i % 4) * 8);
        }
        words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
        words[words[lengthProperty]] = (asciiBitLength | 0);

        for (j = 0; j < words[lengthProperty];) {
            var w = words.slice(j, j += 16);
            var oldHash = hash;
            hash = hash.slice(0, 8);
            
            for (i = 0; i < 64; i++) {
                var w15 = w[i - 15], w2 = w[i - 2];
                var a = hash[0], e = hash[4];
                var temp1 = hash[7]
                    + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                    + ((e & hash[5]) ^ ((~e) & hash[6]))
                    + k[i]
                    + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16]
                        + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                        + w[i - 7]
                        + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                    ) | 0);
                var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                    + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

                hash = [(temp1 + temp2) | 0].concat(hash);
                hash[4] = (hash[4] + temp1) | 0;
            }

            for (i = 0; i < 8; i++) {
                hash[i] = (hash[i] + oldHash[i]) | 0;
            }
        }

        for (i = 0; i < 8; i++) {
            for (j = 3; j >= 0; j--) {
                var b = (hash[i] >> (j * 8)) & 255;
                result += (b < 16 ? '0' : '') + b.toString(16);
            }
        }
        return result;
    }

    function checkCodes() {
        let textVal = document.getElementById('textInput').value.trim().toUpperCase();
        let numVal = document.getElementById('numberInput').value.trim();
        const msg = document.getElementById('message');

        // Поддержка автоперевода русской раскладки КРСК в KRSK
        const ruToEn = {'К':'K', 'Р':'R', 'С':'S'};
        textVal = textVal.split('').map(char => ruToEn[char] || char).join('');

        if (textVal.length !== 4) {
            msg.className = 'error';
            msg.innerText = 'В первом поле должно быть ровно 4 буквы!';
            return;
        }

        if (numVal.length !== 7) {
            msg.className = 'error';
            msg.innerText = 'Во втором поле должно быть ровно 7 цифр!';
            return;
        }

        // Хэширование ввода с солью
        const salt = "_CLSTR_SALT_2026";
        const userTextHash = computeSHA256(textVal + salt);
        const userNumHash = computeSHA256(numVal + salt);

        // Вшитые SHA-256 хэши для "KRSK_CLSTR_SALT_2026" и "9047064_CLSTR_SALT_2026"
        const targetTextHash = "9db85a1efbc96fb6315516086f0cddbb986967732a316b2518e244efbe8bdf40";
        const targetNumHash = "d9dc35914ed0dc327f2f1837500d0fa85f949a2a7cc3f62800bf5f13459e95df";

        if (userTextHash === targetTextHash && userNumHash === targetNumHash) {
            msg.className = 'success';
            msg.innerHTML = 'Reward is waiting just for u...<br><br><a href="https://t.me/ClstrCodeHunt_Bot" target="_blank" class="bot-link">https://t.me/ClstrCodeHunt_Bot</a>';
        } else {
            msg.className = 'error';
            msg.innerText = 'Неверный код! Попробуй еще раз.';
        }
    }
</script>

</body>
</html>
