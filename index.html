<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Verification | Cluster</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #5865F2;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-transform: uppercase;
        }
        input:focus {
            border-color: #5865F2;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }
        .error { color: #ff4d4d; }
        .success { color: #4dff88; }
        .hint {
            margin-top: 20px;
            padding: 10px;
            background-color: #2b2b2b;
            border-left: 3px solid #5865F2;
            font-size: 12px;
            color: #aaa;
            text-align: left;
            line-height: 1.4;
        }
        a.bot-link {
            color: #5865F2;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h2>Code Verification</h2>
    
    <div class="input-group">
        <label for="textInput">Letter Code (4 characters):</label>
        <input type="text" id="textInput" maxlength="4" placeholder="AAAA">
    </div>

    <div class="input-group">
        <label for="numberInput">Number Code (7 digits):</label>
        <input type="text" id="numberInput" maxlength="7" placeholder="0000000">
    </div>

    <button onclick="checkCodes()">SUBMIT</button>

    <div id="message"></div>

    <div class="hint">
        <strong>Hint:</strong><br>
        6&7, interesting numbers, many hate their combination, pity they can't be found in Minecraft, or can they?
    </div>
</div>

<script>
    // Disable dev hotkeys
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || 
           (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
           (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    // SHA-256 hashing
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkCodes() {
        let textVal = document.getElementById('textInput').value.trim().toUpperCase();
        let numVal = document.getElementById('numberInput').value.trim();
        const msg = document.getElementById('message');

        // Auto-fix Cyrillic layout to English (КРСК -> KRSK)
        const ruToEn = {'К':'K', 'Р':'R', 'С':'S'};
        textVal = textVal.split('').map(char => ruToEn[char] || char).join('');

        if (textVal.length !== 4) {
            msg.className = 'error';
            msg.innerText = 'First field must contain exactly 4 letters!';
            return;
        }

        if (numVal.length !== 7) {
            msg.className = 'error';
            msg.innerText = 'Second field must contain exactly 7 digits!';
            return;
        }

        const salt = "CLSTR_EVENT_SECURE_2026";

        const textHash = await sha256(textVal + salt);
        const numHash = await sha256(numVal + salt);

        const targetTextHash = "12ed1916eb4dfa77cbbcfdd47d4e4e94b293ca77c5fb22067bc8be65e06579cf";
        const targetNumHash = "f918ee0851888a7c2fe1bcbd6bb8a83d73f15923bcbb2f974eb066974fbffcd9";

        if (textHash === targetTextHash && numHash === targetNumHash) {
            msg.className = 'success';
            msg.innerHTML = 'Reward is waiting just for u...<br><br><a href="https://t.me/ClstrCodeHunt_Bot" target="_blank" class="bot-link">https://t.me/ClstrCodeHunt_Bot</a>';
        } else {
            msg.className = 'error';
            msg.innerText = 'Invalid code! Try again.';
        }
    }
</script>

</body>
</html>
