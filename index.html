<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод ключей | Кластер</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #5865F2;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-transform: uppercase;
        }
        input:focus {
            border-color: #5865F2;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }
        .error { color: #ff4d4d; }
        .success { color: #4dff88; }
        #debug {
            margin-top: 15px;
            font-family: monospace;
            font-size: 11px;
            color: #888;
            text-align: left;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Проверка Кода</h2>
    
    <div class="input-group">
        <label for="textInput">Код из букв (4 символа):</label>
        <input type="text" id="textInput" maxlength="4" placeholder="AAAA">
    </div>

    <div class="input-group">
        <label for="numberInput">Код из цифр (7 символов):</label>
        <input type="text" id="numberInput" maxlength="7" placeholder="0000000">
    </div>

    <button onclick="checkCodes()">ОТПРАВИТЬ</button>

    <div id="message"></div>
    <div id="debug"></div>
</div>

<script>
    function checkCodes() {
        let textVal = document.getElementById('textInput').value.trim().toUpperCase();
        let numVal = document.getElementById('numberInput').value.trim();
        const msg = document.getElementById('message');
        const debug = document.getElementById('debug');

        // Автозамена русской раскладки КРСК на английскую KRSK
        const ruToEn = {'К':'K', 'Р':'R', 'С':'S'};
        textVal = textVal.split('').map(char => ruToEn[char] || char).join('');

        // Преобразуем ввод в прямые коды символов
        let textChars = [];
        for(let i=0; i<textVal.length; i++) textChars.push(textVal.charCodeAt(i));

        let debugInfo = `Ввод букв: "${textVal}" (длина: ${textVal.length}, коды: ${textChars.join(',')})<br>`;
        debugInfo += `Ввод цифр: "${numVal}" (длина: ${numVal.length})<br>`;

        if (textVal === "KRSK" && numVal === "9047064") {
            msg.className = 'success';
            msg.innerHTML = 'Reward is waiting just for u...<br><br><a href="https://t.me/ClstrCodeHunt_Bot" target="_blank" style="color:#5865F2">https://t.me/ClstrCodeHunt_Bot</a>';
            debug.innerHTML = debugInfo + "<b style='color:#4dff88'>Сравнение прошло успешно!</b>";
        } else {
            msg.className = 'error';
            msg.innerText = 'Неверный код! Попробуй еще раз.';
            debug.innerHTML = debugInfo + "<b style='color:#ff4d4d'>Ошибка: совпадения нет.</b>";
        }
    }
</script>

</body>
</html>
